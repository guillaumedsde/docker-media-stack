# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3-file-provider.json

tls:
  options:
    default:
      minVersion: VersionTLS12
      # allow routing to honeypot
      sniStrict: false

http:
  middlewares:
    denyMetrics:
      redirectRegex:
        regex: "^https://(.*)/metrics$"
        replacement: "http://$${1}/"
    securityHeaders:
      # NOTE: all headers are case insensitive
      # NOTE: set to empty string to remove header (yaml null value does not work)
      headers:
        customResponseHeaders:
          x-robots-tag: "noindex, nofollow"
          x-frame-options: "SAMEORIGIN"
          permissions-policy: "interest-cohort=()"
          referrer-policy: "strict-origin-when-cross-origin"
          x-content-type-options: "nosniff"
          strict-transport-security: "max-age=63072000; includeSubDomains; preload"
          server: ""
          x-powered-by: ""
          x-aspnet-version: ""
          x-aspnetmvc-version: ""
        customRequestHeaders:
          remote-user: ""
          x-remote-user: ""
    llamaAuth:
      headers:
        customRequestHeaders:
          Authorization: 'Bearer {{ env "TMPL_LLAMA_API_KEY" }}'
  serversTransports:
    llama-transport:
      serverName: "llama-server"
      rootCAs:
        - /etc/traefik/llama.crt
  routers:
    llama:
      rule: 'Host(`chat.{{ env "TMPL_ROOT_DOMAIN" }}`)'
      service: llama
      entryPoints:
        - websecure
      middlewares:
        - authelia
        - llamaAuth
  services:
    llama:
      loadBalancer:
        servers:
          - url: '{{ env "TMPL_LLAMA_ADDRESS" }}'
        serversTransport: llama-transport
