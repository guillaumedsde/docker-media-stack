# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3-file-provider.json
# {{ $domain := env "TMPL_ROOT_DOMAIN" }}
http:
  middlewares:
    denyMetrics:
      redirectRegex:
        regex: "^https://(.*)/metrics$"
        replacement: "http://$${1}/"
    securityHeaders:
      # NOTE: all headers are case insensitive
      # NOTE: set to empty string to remove header (yaml null value does not work)
      # NOTE: applied to all routers on the websecure entrypoint via
      #       TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_MIDDLEWARES
      headers:
        customResponseHeaders:
          x-robots-tag: "noindex, nofollow"
          x-frame-options: "SAMEORIGIN"
          permissions-policy: "interest-cohort=()"
          referrer-policy: "strict-origin-when-cross-origin"
          x-content-type-options: "nosniff"
          strict-transport-security: "max-age=63072000; includeSubDomains; preload"
          server: ""
          x-powered-by: ""
          x-aspnet-version: ""
          x-aspnetmvc-version: ""
        customRequestHeaders:
          remote-user: ""
          x-remote-user: ""
    llamaAuth:
      headers:
        customRequestHeaders:
          Authorization: 'Bearer {{ env "TMPL_LLAMA_API_KEY" }}'
    nextcloud-redirectregex:
      redirectRegex:
        permanent: true
        regex: 'https://cloud.{{ $domain }}/.well-known/(card|cal)dav'
        replacement: 'https://cloud.{{ $domain }}/remote.php/dav/'
    ombi-jellyseer-redirect:
      redirectRegex:
        permanent: false
        regex: '^https?://ombi.{{ $domain }}/(.*)'
        replacement: 'https://jellyseer.{{ $domain }}/'
    qb-headers:
      headers:
        customRequestHeaders:
          X-Frame-Options: "SAMEORIGIN"
          Referer: ""
          Origin: ""
    authelia:
      forwardAuth:
        address: 'http://authelia:9091/api/verify?rd=https://authelia.{{ $domain }}/'
        trustForwardHeader: true
        authResponseHeaders:
          - Remote-User
          - Remote-Name
          - Remote-Email
    anubis:
      forwardAuth:
        address: "http://anubis:8080/.within.website/x/cmd/anubis/api/check"

  serversTransports:
    llama-transport:
      serverName: "llama-server"
      rootCAs:
        - /etc/traefik/llama.crt

  routers:
    # NOTE: securityHeaders is applied to all routers on the websecure
    #       entrypoint (see TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_MIDDLEWARES)
    #       and is therefore not repeated per-router
    # Dashboard
    dashboard:
      rule: Host(`traefik.{{ $domain }}`)
      service: api@internal
      entryPoints: [websecure]
      middlewares: [authelia]

    # Healthcheck
    ping:
      rule: Host(`ping.{{ $domain }}`)
      service: ping@internal
      entryPoints: [websecure]

    # honeycut
    honeycut:
      rule: '{{ env "TMPL_HONEYCUT_TRAEFIK_RULE" }}'
      service: honeycut
      entryPoints: [websecure]
      # NOTE: keep the honeypot below every other router, default router
      #       priority is the length of the rule (always > 1 here)
      priority: 1

    # anubis
    anubis:
      rule: Host(`anubis.{{ $domain }}`)
      service: anubis
      entryPoints: [websecure]

    # Prowlarr (via wireguard)
    prowlarr:
      rule: Host(`prowlarr.{{ $domain }}`)
      service: prowlarr
      entryPoints: [websecure]
      middlewares: [authelia]

    # qBittorrent (via wireguard)
    qbittorrent:
      rule: Host(`torrent.{{ $domain }}`)
      service: qbittorrent
      entryPoints: [websecure]
      middlewares: [authelia, qb-headers]

    radarr:
      rule: Host(`movies.{{ $domain }}`)
      service: radarr
      entryPoints: [websecure]
      middlewares: [authelia]

    sonarr:
      rule: Host(`series.{{ $domain }}`)
      service: sonarr
      entryPoints: [websecure]
      middlewares: [authelia]

    bazarr:
      rule: Host(`subtitles.{{ $domain }}`)
      service: bazarr
      entryPoints: [websecure]
      middlewares: [authelia]

    maintainerr:
      rule: Host(`maintainerr.{{ $domain }}`)
      service: maintainerr
      entryPoints: [websecure]
      middlewares: [authelia]

    cleanuparr:
      rule: Host(`cleanuparr.{{ $domain }}`)
      service: cleanuparr
      entryPoints: [websecure]
      middlewares: [authelia]

    homer:
      rule: Host(`home.{{ $domain }}`) || Host(`{{ $domain }}`)
      service: homer
      entryPoints: [websecure]
      middlewares: [authelia]

    jellyfin:
      rule: Host(`jellyfin.{{ $domain }}`)
      service: jellyfin
      entryPoints: [websecure]
      middlewares: [denyMetrics]

    jellyseer:
      rule: Host(`jellyseer.{{ $domain }}`) || Host(`ombi.{{ $domain }}`)
      service: jellyseer
      entryPoints: [websecure]
      middlewares: [ombi-jellyseer-redirect, anubis]

    nextcloud:
      rule: Host(`cloud.{{ $domain }}`)
      service: nextcloud
      entryPoints: [websecure]
      middlewares: [nextcloud-redirectregex]

    miniflux:
      rule: Host(`miniflux.{{ $domain }}`)
      service: miniflux
      entryPoints: [websecure]
      middlewares: [denyMetrics, authelia]

    librespeed:
      rule: Host(`librespeed.{{ $domain }}`)
      service: librespeed
      entryPoints: [websecure]
      middlewares: [authelia]

    tandoor:
      rule: Host(`tandoor.{{ $domain }}`)
      service: tandoor
      entryPoints: [websecure]
      middlewares: [authelia]

    robots:
      rule: ( Host(`{{ $domain }}`) || HostRegexp(`[a-z]+.{{ $domain }}`) ) && Path(`/robots.txt`)
      service: robots
      entryPoints: [websecure]

    scrutiny:
      rule: Host(`scrutiny.{{ $domain }}`)
      service: scrutiny
      entryPoints: [websecure]
      middlewares: [authelia]

    prometheus:
      rule: Host(`prometheus.{{ $domain }}`)
      service: prometheus
      entryPoints: [websecure]
      middlewares: [authelia]

    grafana:
      rule: Host(`grafana.{{ $domain }}`)
      service: grafana
      entryPoints: [websecure]
      middlewares: [authelia]

    lldap:
      rule: Host(`lldap.{{ $domain }}`)
      service: lldap
      entryPoints: [websecure]
      middlewares: [anubis]

    authelia:
      rule: Host(`authelia.{{ $domain }}`)
      service: authelia
      entryPoints: [websecure]

    # llama (from file)
    llama:
      rule: 'Host(`chat.{{ $domain }}`)'
      service: llama
      entryPoints: [websecure]
      middlewares: [authelia, llamaAuth]

  services:
    # NOTE: no healthCheck for honeycut/anubis (no known health endpoint)
    honeycut:
      loadBalancer:
        servers:
          - url: "http://honeycut:8080"

    anubis:
      loadBalancer:
        servers:
          - url: "http://anubis:8080"

    prowlarr:
      loadBalancer:
        servers:
          - url: "http://prowlarr:9696"
        healthCheck: {path: /ping}

    qbittorrent:
      loadBalancer:
        servers:
          - url: "http://qbittorrent:8080"
        passHostHeader: false
        healthCheck: {path: /}

    radarr:
      loadBalancer:
        servers:
          - url: "http://radarr:7878"
        healthCheck: {path: /ping}

    sonarr:
      loadBalancer:
        servers:
          - url: "http://sonarr:8989"
        healthCheck: {path: /ping}

    bazarr:
      loadBalancer:
        servers:
          - url: "http://bazarr:6767"
        healthCheck: {path: /}

    maintainerr:
      loadBalancer:
        servers:
          - url: "http://maintainerr:6246"
        healthCheck: {path: /api/health/ready}

    cleanuparr:
      loadBalancer:
        servers:
          - url: "http://cleanuparr:11011"
        healthCheck: {path: /health}

    homer:
      loadBalancer:
        servers:
          - url: "http://homer:8080"
        healthCheck: {path: /}

    jellyfin:
      loadBalancer:
        servers:
          - url: "http://jellyfin:8096"
        healthCheck: {path: /health}

    jellyseer:
      loadBalancer:
        servers:
          - url: "http://jellyseer:5055"
        healthCheck: {path: /}

    nextcloud:
      loadBalancer:
        servers:
          - url: "http://nextcloud:80"
        healthCheck: {path: /status.php}

    miniflux:
      loadBalancer:
        servers:
          - url: "http://miniflux:8080"
        healthCheck: {path: /healthcheck}

    librespeed:
      loadBalancer:
        servers:
          - url: "http://librespeed:8080"
        healthCheck: {path: /}

    tandoor:
      loadBalancer:
        servers:
          - url: "http://tandoor:8080"
        healthCheck: {path: /openapi/}

    robots:
      loadBalancer:
        servers:
          - url: "http://robots:8080"
        healthCheck: {path: /robots.txt}

    scrutiny:
      loadBalancer:
        servers:
          - url: "http://scrutiny:8080"
        healthCheck: {path: /api/health}

    prometheus:
      loadBalancer:
        servers:
          - url: "http://prometheus:9090"
        healthCheck: {path: /-/ready}

    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"
        healthCheck: {path: /api/health}

    lldap:
      loadBalancer:
        servers:
          - url: "http://lldap:17170"
        healthCheck: {path: /health}

    authelia:
      loadBalancer:
        servers:
          - url: "http://authelia:9091"
        healthCheck: {path: /api/health}

    llama:
      loadBalancer:
        servers:
          - url: '{{ env "TMPL_LLAMA_ADDRESS" }}'
        serversTransport: llama-transport
        healthCheck: {path: /health}
